[package]
name = "valler"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
auto-launch = "0.6.0"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36"
egui = "0.36"
egui-phosphor = "0.14"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
keepawake = "0.6.1"
local-ip-address = "0.6.13"
notify-rust = "4.18.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
starship-battery = "0.12.0"
sysinfo = "0.40.1"
trash = "5.3.0"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ureq = "3.5.1"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
netstat2 = "0.11.2"
