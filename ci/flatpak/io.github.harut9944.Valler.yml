# Flatpak manifest for Valler, built from an already compiled program by
# ci/package-flatpak.sh (which puts valler, valler.png and valler.desktop next
# to this file).
app-id: io.github.harut9944.Valler
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: valler
rename-desktop-file: valler.desktop
rename-icon: valler
finish-args:
  - --share=ipc
  - --share=network                 # speed test, public IP
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio             # mixer
  - --device=dri
  - --filesystem=home               # Shelf, cleaner, media conversion
  - --filesystem=xdg-config/autostart:create  # start at login
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver   # keep awake
  - --system-talk-name=org.freedesktop.login1 # keep awake
  - --talk-name=org.kde.StatusNotifierWatcher # tray icon
  - --own-name=org.kde.StatusNotifierItem-2-1
modules:
  - name: valler
    buildsystem: simple
    build-commands:
      - install -Dm755 valler /app/bin/valler
      - install -Dm644 valler.png /app/share/icons/hicolor/256x256/apps/valler.png
      - install -Dm644 valler.desktop /app/share/applications/valler.desktop
    sources:
      - type: file
        path: valler
      - type: file
        path: valler.png
      - type: file
        path: valler.desktop
